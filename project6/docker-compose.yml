version:  '3.8'

services:
  # Service 1: The Web Server
  webserver:
    image: nginx:alpine
    container_name: custom_web
    ports:
      - "8080:80"
    restart: always

  # Service 2: The Database
  database:
    image: postgres:15-alpine
    container_name: custom_db
    environment:
      POSTGRES_USER: intern_user
      POSTGRES_PASSWORD: SecretPassword123
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    restart: always
